<!doctype html>
<html lang="{{ .Site.LanguageCode }}" prefix="og: http://ogp.me/ns#">
<head>
  <meta charset="utf-8"/>
  <!-- favicon -->
  <link rel="icon" type="image/png" href="{{ "images/favicon/favicon.ico" | relURL }}">
  <link rel="icon" type="image/png" href="{{ "images/favicon/favicon16.png" | relURL }}" sizes="16x16">
  <link rel="icon" type="image/png" href="{{ "images/favicon/favicon32.png" | relURL }}" sizes="32x32">
  <link rel="icon" type="image/png" href="{{ "images/favicon/favicon48.png" | relURL }}" sizes="48x48">
  <link rel="icon" type="image/png" href="{{ "images/favicon/favicon96.png" | relURL }}" sizes="96x96">
  <link rel="icon" type="image/png" href="{{ "images/favicon/favicon192.png" | relURL }}" sizes="192x192">
  <link rel="apple-touch-icon" sizes="57x57" href="{{ "images/apple-touch-icon/apple-touch-icon57.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="72x72" href="{{ "images/apple-touch-icon/apple-touch-icon72.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="76x76" href="{{ "images/apple-touch-icon/apple-touch-icon76.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="114x114" href="{{ "images/apple-touch-icon/apple-touch-icon114.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="120x120" href="{{ "images/apple-touch-icon/apple-touch-icon120.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="144x144" href="{{ "images/apple-touch-icon/apple-touch-icon144.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="152x152" href="{{ "images/apple-touch-icon/apple-touch-icon152.png" | relURL }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "images/apple-touch-icon/apple-touch-icon180.png" | relURL }}">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

  <!-- OGP information -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}"/>
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ .Permalink }}"/>
  <meta property="og:image" content="{{ "images/twitter_card.jpg" | absURL }}"/>
  <meta property="og:site_name" content="{{ .Site.Title }}"/>
  <meta property="og:description" content="{{ .Site.Params.description }}"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:site" content="{{ .Site.Params.twitter }}"/>
  <meta name="twitter:creator" content="{{ .Site.Params.twitter }}">

  <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport'/>
  <meta name="viewport" content="width=device-width"/>

  <!-- Bootstrap core CSS     -->
  <link href="{{ "css/bootstrap.min.css" | relURL }}" rel="stylesheet"/>
  <link href="{{ "css/paper-kit.css?v=2.1.0" | relURL }}" rel="stylesheet"/>
  <link href="{{ "css/main.css" | relURL }}" rel="stylesheet"/>

  <!--     Fonts and icons     -->
  <link href='//fonts.googleapis.com/css?family=Montserrat:400,300,700' rel='stylesheet' type='text/css'>
  <link href="//maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet">
  <link href="{{ "css/nucleo-icons.css" | relURL }}" rel="stylesheet">

</head>
<body>
{{- partial "header.html" . -}}
<div class="wrapper">
  {{- block "main" . }}{{- end }}
</div>
{{- partial "footer.html" . -}}

<!-- Core JS Files -->
<script src="{{ "js/jquery-3.2.1.js" | relURL }}" type="text/javascript"></script>
<script src="{{ "js/jquery-ui-1.12.1.custom.min.js" | relURL }}" type="text/javascript"></script>
<script src="{{ "js/popper.js" | relURL }}" type="text/javascript"></script>
<script src="{{ "js/bootstrap.min.js" | relURL }}" type="text/javascript"></script>
<script src="{{ "js/bootstrap-switch.min.js" | relURL }}" type="text/javascript"></script>
<!--  Paper Kit Initialization and functions -->
<script src="{{ "js/paper-kit.js?v=2.1.0" | relURL }}"></script>

</body>
</html>
